__include__: ['../phase_stql_qcer/qcer_rgbt_common.yml']

# Frozen H0--H3 protocol.  All arms use the same verified composite
# initialization supplied with -t weights/stql_qcer_common_init_v1.pth.
epochs: 20
checkpoint_freq: 2
gradient_accumulation_steps: 2
skip_model_profile: True

DFINE:
  qcer_enabled: False
  qdmf_enabled: False
  qdmf_bypass: False
  qdmf_scales: [8, 16, 32]
  qdmf_roi_expand: 1.5
  qdmf_roi_grid: 3
  qdmf_num_heads: 4
  qdmf_gate_dim: 64
  qdmf_gate_hidden: 128
  qdmf_gate_init_bias: -2.0
  qdmf_output_init_std: 0.001
  qdmf_ir_dropout: 0.10
  qdmf_detach_ir_features: True
  qdmf_detach_base_boxes: True
  qdmf_detach_rgb_uncertainty: True
  qdmf_matcher_use_base_outputs: True
  qdmf_residual_warmup_start: 0
  qdmf_residual_warmup_end: 6
  qdmf_residual_init_scale: 0.10
  qdmf_residual_final_scale: 1.00
  qdmf_log_diagnostics: True

DFINECriterion:
  qcer_objectness_weight: 0.0

optimizer:
  type: AdamW
  foreach: False
  params:
    -
      params: '^(?=.*(?:stql|qdmf)).*$'
      lr: 0.0002
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00001
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00002
      weight_decay: 0.0
  lr: 0.00002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

