task: detection

evaluator:
  type: CocoEvaluator
  iou_types: [bbox]

num_classes: 1
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/autodl-tmp/Dataset/Anti_UAV_6K/train/visible/images
    ann_file: /root/autodl-tmp/rgbt_experiments/data/antiuav6k/annotations/instances_visible_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 8
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/autodl-tmp/Dataset/Anti_UAV_6K/val/visible/images
    ann_file: /root/autodl-tmp/rgbt_experiments/data/antiuav6k/annotations/instances_visible_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 8
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
