__include__: [
  './antiuav6k_visible.yml',
  '../../configs/runtime.yml',
  '../../configs/dfine/include/dataloader.yml',
  '../../configs/dfine/include/optimizer.yml',
  '../../configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: /root/autodl-tmp/rgbt_experiments/outputs/dfine_n_visible_640_square
sync_bn: False

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: B0
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512
  expansion: 0.34
  depth_mult: 0.5

DFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2
  num_layers: 3
  eval_idx: -1
  num_points: [6, 6]

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 220

train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      policy:
        epoch: 200
  collate_fn:
    stop_epoch: 200
    ema_restart_decay: 0.9999
    base_size_repeat: 3

val_dataloader:
  total_batch_size: 16
