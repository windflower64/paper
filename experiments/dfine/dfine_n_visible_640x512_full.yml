__include__: [
  './dfine_n_visible_640x512.yml',
]

output_dir: /root/autodl-tmp/rgbt_experiments/outputs/dfine_n_visible_640x512_full_seed0
sync_bn: False
use_ema: True
epochs: 220

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 32
  num_workers: 4
  dataset:
    transforms:
      policy:
        name: stop_epoch
        epoch: 200
        ops: [RandomPhotometricDistort, RandomZoomOut, RandomIoUCrop]
  collate_fn:
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 200
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 32
  num_workers: 0
