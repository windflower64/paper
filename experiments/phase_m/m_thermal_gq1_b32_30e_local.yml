__include__: ['../phase_s/visible_60e_base_local.yml']

# Thermal-only target-aware pretraining for the SDTEC evidence branch.
output_dir: E:/two_paper/outputs/M_THERMAL_GQ1_B32_30E/seed0
epochs: 30
checkpoint_freq: 5

HGNetv2:
  pat_stage: -1
  pat_sf_stage: 3
  pat_sf_n_div: 4
  pat_sf_variant: global_query

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00005
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00005
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0001
      weight_decay: 0.0
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 200

train_dataloader:
  total_batch_size: 32
  num_workers: 2
  dataset:
    type: CocoDetection
    img_folder: F:/data/Anti-UAV/Anti_UAV_6K/train/infrared/images
    ann_file: E:/two_paper/data/antiuav6k_ir/annotations/instances_infrared_train.json
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [512, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
      policy:
        name: stop_epoch
        epoch: 200
        ops: [RandomPhotometricDistort, RandomZoomOut, RandomIoUCrop]
  collate_fn:
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 200

val_dataloader:
  total_batch_size: 32
  num_workers: 0
  dataset:
    type: CocoDetection
    img_folder: F:/data/Anti-UAV/Anti_UAV_6K/val/infrared/images
    ann_file: E:/two_paper/data/antiuav6k_ir/annotations/instances_infrared_val.json
    transforms:
      ops:
        - {type: Resize, size: [512, 640]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
