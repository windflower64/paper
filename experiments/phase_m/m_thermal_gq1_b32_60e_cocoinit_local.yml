__include__: ['./m_thermal_gq1_b32_30e_local.yml']

# Full Thermal-GQ1 training from the same official D-FINE COCO initialization
# used by the established Visible experiments.
output_dir: E:/two_paper/outputs/M_THERMAL_GQ1_B32_60E_COINIT_R1/seed0
epochs: 60
checkpoint_freq: 6

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
