__include__: ['./m_sd21_pair_base_b8a4_20e_testdev_local.yml']

output_dir: E:/two_paper/outputs/M_SD21_TOKEN_CDM_B8A4_20E_TESTDEV/seed0

DFINE:
  rgbt_sd2_enabled: True
  rgbt_sd2_variant: token
  rgbt_sd2_hidden_dim: 128
  rgbt_sd2_num_levels: 2
  rgbt_sd2_bottleneck_dim: 64
  rgbt_sd2_num_tokens: 4
  rgbt_sd2_num_heads: 4
  rgbt_sd2_max_rms_ratio: 0.03

# M-SD2.1 uses the same 2e-4 rate as the C/D encoder and decoder.  The first
# explicit group only separates new parameters for audit; C/D groups are
# byte-for-byte equal to the paired control.
optimizer:
  type: AdamW
  foreach: False
  params:
    -
      params: '^sd2_conditioner\..*$'
      lr: 0.0002
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
