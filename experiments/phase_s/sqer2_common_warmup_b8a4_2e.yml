__include__: ["../reproduction/r0_historical_cplusmhalf_sgc2_20e.yml"]

# Shared warmup. S-QER2 is constructed and included in the optimizer from
# epoch 0, but remains bypassed while the detector calibrates its queries.
output_dir: E:/two_paper/outputs/SQER2_COMMON_WARMUP_B8A4_2E/seed0
epochs: 2

DFINE:
  sqer_enabled: True
  sqer_bypass: True
  sqer_evidence_only: True
  sqer_topk: 64
  sqer_roi_size: 16
  sqer_roi_expand: 2.0
  sqer_min_roi_width_px: 32.0
  sqer_min_roi_height_px: 32.0

DFINECriterion:
  sqer_shape_weight: 0.0
  sqer_supervision: sam

optimizer:
  type: AdamW
  foreach: False
  params:
    -
      params: '^sqer.*$'
      lr: 0.0002
    -
      params: '^sd2_conditioner.*$'
      lr: 0.0002
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
