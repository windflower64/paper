__include__:
  - './visible_60e_base.yml'

output_dir: /root/autodl-tmp/rgbt_experiments/runs/20_spatial_importance/S_CAND1_PU_S8_S16/seed0

# S-CAND1-PU: keep the validated Targetness q and adaptive four-candidate
# fusion, but replace learned 3x3 group-stride candidates with exact 2x2
# PixelUnshuffle/Polyphase candidates at S8 -> S16.
HGNetv2:
  lad_stage: 2
  lad_groups: 8
  lad_target_gate: True
  lad_candidate_mode: polyphase

DFINECriterion:
  spatial_aux_weight: 0.10
  spatial_aux_dice_weight: 1.0
