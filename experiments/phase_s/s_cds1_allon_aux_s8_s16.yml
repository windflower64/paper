__include__:
  - './visible_60e_base.yml'

output_dir: /root/autodl-tmp/rgbt_experiments/runs/20_spatial_importance/S_CDS1_ALLON_AUX_S8_S16/seed0

# Strict route-necessity control for S-CDS1.
# The targetness head and its AUX supervision remain active, but q is fixed to
# one only in the detection fusion path. Everything else matches CDS1.
HGNetv2:
  lad_stage: 2
  lad_groups: 8
  lad_target_gate: True
  lad_candidate_mode: learned_conv
  lad_fusion_mode: stable_route
  lad_route_init: 0.10
  lad_target_gate_mode: one

DFINECriterion:
  spatial_aux_weight: 0.10
  spatial_aux_dice_weight: 1.0
