__include__: [
  './visible_60e_base_local.yml',
]

output_dir: E:/two_paper/runs/21_public_reproduction/S_REP1_1_A00FT6_LR02_CONTROL/seed0
epochs: 6

# Gentle adaptation: one fifth of the original A00 learning rate.
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00004
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 16

val_dataloader:
  total_batch_size: 16
