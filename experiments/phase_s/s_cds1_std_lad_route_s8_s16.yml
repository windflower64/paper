__include__:
  - './visible_60e_base.yml'

output_dir: /root/autodl-tmp/rgbt_experiments/runs/20_spatial_importance/S_CDS1_STD_LAD_ROUTE_S8_S16/seed0

# S-CDS1: preserve the original D-FINE standard S8->S16 downsample as an
# exact stable fallback. Supervised targetness q routes only important
# locations toward the learned LAD detail operator. PixelUnshuffle is absent.
HGNetv2:
  lad_stage: 2
  lad_groups: 8
  lad_target_gate: True
  lad_candidate_mode: learned_conv
  lad_fusion_mode: stable_route
  lad_route_init: 0.10

DFINECriterion:
  spatial_aux_weight: 0.10
  spatial_aux_dice_weight: 1.0
