__include__: ["../reproduction/r0_historical_cplusmhalf_sgc2_20e.yml"]

# S-QER1 paired screening base.  The historical R0 model remains the detector
# initializer; both experiment arms inherit this exact frozen protocol.
output_dir: E:/two_paper/outputs/SQER1_COMMON_B8A4_20E_TESTDEV/seed0

DFINE:
  sqer_enabled: True
  sqer_bypass: False
  sqer_topk: 64
  sqer_roi_size: 16
  sqer_roi_expand: 2.0
  sqer_min_roi_width_px: 32.0
  sqer_min_roi_height_px: 32.0

DFINECriterion:
  sqer_shape_weight: 0.05
  sqer_supervision: sam

optimizer:
  type: AdamW
  foreach: False
  params:
    -
      params: '^sqer.*$'
      lr: 0.0002
    -
      params: '^sd2_conditioner.*$'
      lr: 0.0002
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
